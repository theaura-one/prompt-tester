<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
  .config-bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  .config-bar label { font-size: 13px; font-weight: 600; color: #555; }
  .config-bar select, .config-bar input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .config-bar select { min-width: 180px; }
  .config-bar input[type="number"] { width: 100px; }
  .system-prompt-section { padding: 12px 16px; background: #fafafa; border-bottom: 1px solid #ddd; }
  .system-prompt-section .header { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .system-prompt-section .header h3 { font-size: 13px; color: #555; }
  .system-prompt-section .header .toggle { font-size: 11px; color: #999; }
  .system-prompt-section textarea { margin-top: 8px; width: 100%; min-height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 13px; resize: vertical; }
  .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .message.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
  .message.assistant { align-self: flex-start; background: #fff; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
  .message.error { align-self: center; background: #fee; color: #c00; border: 1px solid #fcc; font-size: 13px; }
  .input-area { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #ddd; }
  .input-area textarea { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; font-family: inherit; }
  .input-area button { padding: 10px 20px; background: #007aff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .input-area button:hover { background: #005ecb; }
  .input-area button:disabled { background: #999; cursor: not-allowed; }
  .clear-btn { padding: 6px 12px; background: #eee; color: #555; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .clear-btn:hover { background: #ddd; }
</style>
</head>
<body>

<div class="config-bar">
  <label for="model-select">Model:</label>
  <select id="model-select"></select>
  <label for="max-tokens">Max Tokens:</label>
  <input type="number" id="max-tokens" value="1024" min="1" max="128000" step="256">
  <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
</div>

<div class="system-prompt-section">
  <div class="header" onclick="toggleSystemPrompt()">
    <h3>System Prompt</h3>
    <span class="toggle" id="sp-toggle">&#9660;</span>
  </div>
  <textarea id="system-prompt" placeholder="Enter system prompt here..."></textarea>
</div>

<div class="chat-area" id="chat-area"></div>

<div class="input-area">
  <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const maxTokensInput = document.getElementById('max-tokens');
const systemPromptEl = document.getElementById('system-prompt');
let messages = [];
let spVisible = true;

fetch('/api/models')
  .then(r => r.json())
  .then(models => {
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      modelSelect.appendChild(opt);
    });
  });

function toggleSystemPrompt() {
  spVisible = !spVisible;
  systemPromptEl.style.display = spVisible ? '' : 'none';
  document.getElementById('sp-toggle').innerHTML = spVisible ? '&#9660;' : '&#9654;';
}

function addMessageBubble(role, content) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = content;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function clearChat() {
  messages = [];
  chatArea.innerHTML = '';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  userInput.value = '';
  messages.push({ role: 'user', content: text });
  addMessageBubble('user', text);

  sendBtn.disabled = true;
  sendBtn.textContent = '...';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelSelect.value,
        system_prompt: systemPromptEl.value,
        messages: messages,
        max_tokens: parseInt(maxTokensInput.value) || 1024,
      }),
    });
    const data = await resp.json();
    if (data.error) {
      addMessageBubble('error', 'Error: ' + data.error);
    } else {
      messages.push({ role: 'assistant', content: data.content });
      addMessageBubble('assistant', data.content);
    }
  } catch (err) {
    addMessageBubble('error', 'Network error: ' + err.message);
  }

  sendBtn.disabled = false;
  sendBtn.textContent = 'Send';
}

// Auto-resize input
userInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
